# Ejecuta CI con cada push a las ramas principales.
trigger:
  branches:
    include:
      - main
      - master

# Desactiva las ejecuciones automáticas por pull requests.
pr: none

# Ejecuta las tareas en tu computadora.
pool:
  name: 'Default'
  demands:
    - Agent.Name -equals Luna-PC

variables:
  buildConfiguration: 'Release'

steps:
# Descarga el repositorio.
- checkout: self

# Instala .NET 8.
- task: UseDotNet@2
  displayName: 'Instalar .NET 8'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# Restaura las dependencias.
- script: dotnet restore SistemaReservasLaboratorios.sln
  displayName: 'Restaurar dependencias'

# Compila la solución.
- script: dotnet build SistemaReservasLaboratorios.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Compilar en Release'

# Ejecuta pruebas unitarias y de integración.
- script: dotnet test SistemaReservasLaboratorios.Tests/SistemaReservasLaboratorios.Tests.csproj --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=resultados.trx" --results-directory "$(Agent.TempDirectory)/TestResults"
  displayName: 'Ejecutar pruebas unitarias e integración'

# Publica los resultados aunque alguna prueba falle.
- task: PublishTestResults@2
  displayName: 'Publicar reporte de pruebas'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Agent.TempDirectory)/TestResults'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
    testRunTitle: 'KyroSoft - $(Build.BuildNumber)'

# Guarda los archivos TRX cuando la ejecución termina correctamente.
- task: PublishPipelineArtifact@1
  displayName: 'Guardar archivos TRX'
  condition: succeeded()
  inputs:
    targetPath: '$(Agent.TempDirectory)/TestResults'
    artifact: 'reportes-pruebas'
